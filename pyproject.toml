[project]
name = "odoo-cli"
version = "0.1.0"
description = "CLI tool for Odoo development workflows"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Frederic van der Essen" },
]
keywords = ["odoo", "cli", "development", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "questionary>=2",
    "tomli-w>=1",
]

[project.scripts]
odoo-cli = "odoo_cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.hatch.build.targets.wheel]
packages = ["odoo_cli"]
artifacts = ["odoo_cli/ai/skills/*.md", "odoo_cli/ai/overview.md"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
