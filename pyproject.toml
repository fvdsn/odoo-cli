[project]
name = "odoo-cli-official"
version = "1.0.0.dev0"
description = "CLI tool to manage and develop local Odoo instances"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Frederic van der Essen" },
]
keywords = ["odoo", "cli", "development", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
# Runtime is stdlib plus the vendored click under odoo_cli/_vendor.
dependencies = []

[project.scripts]
odoo = "odoo_cli.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["odoo_cli/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["odoo_cli"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
